<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ADV Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
    <h3 class="display-4">Welcome</h3>
    <hr>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Product List</h2>
        <a th:href="@{/product/create}" class="btn btn-primary">Create Product</a>
    </div>

    <table class="table table-hover table-bordered">
        <thead class="table-dark">
        <tr>
            <th scope="col">Product Name</th>
            <th scope="col">Quantity</th>
            <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product: ${products}">
            <td th:text="${product.productName}"></td>
            <td th:text="${product.productQuantity}"></td>
            <td>
                <div class="btn-group" role="group">
                    <a th:href="@{/product/edit/{id}(id=${product.productId})}"
                       class="btn btn-warning btn-sm">Edit</a>

                    <a th:href="@{/product/delete/{id}(id=${product.productId})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this product?')">Delete</a>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(products)}">
            <td colspan="3" class="text-center text-muted">No products available.</td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
