<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<h2>All Payments (Admin)</h2>
<ul>
    <li th:each="payment : ${payments}">
        <span th:text="${payment.id}"></span> - <span th:text="${payment.status}"></span>
        <a th:href="@{'/payment/admin/detail/' + ${payment.id}}">View/Action</a>
    </li>
</ul>
</body>
</html>
