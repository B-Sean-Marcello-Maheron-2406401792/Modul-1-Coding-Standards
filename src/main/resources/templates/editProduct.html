<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Product</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body { background-color: #f8f9fa; }
    .card { border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .btn-primary { border-radius: 8px; padding: 10px 20px; font-weight: 600; }
    .form-control { border-radius: 8px; }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <a th:href="@{/product/list}" class="btn btn-light mb-3">← Back to Product List</a>

      <div class="card p-4">
        <h3 class="mb-4 text-center">Edit Product</h3>
        <hr>

        <form th:action="@{/product/edit}" th:object="${product}" method="POST">
          <input type="hidden" th:field="*{productId}">

          <div class="form-group">
            <label for="nameInput" class="font-weight-bold">Product Name</label>
            <input th:field="*{productName}" type="text"
                   class="form-control" id="nameInput"
                   placeholder="Enter name" required>
          </div>

          <div class="form-group">
            <label for="quantityInput" class="font-weight-bold">Quantity</label>
            <input th:field="*{productQuantity}" type="number"
                   class="form-control" id="quantityInput"
                   placeholder="Enter quantity" min="0">
            <small class="form-text text-muted">Modify the current stock quantity.</small>
          </div>

          <div class="mt-4">
            <button type="submit" class="btn btn-primary btn-block">Update Product</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
