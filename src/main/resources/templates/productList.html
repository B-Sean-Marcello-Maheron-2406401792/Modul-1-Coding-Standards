<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List - ADV Shop</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .table thead th { border-top: none; background-color: #f1f3f5; color: #495057; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; }
        .btn { border-radius: 8px; font-weight: 600; transition: all 0.2s; }
        .btn-sm { border-radius: 6px; }
        .product-name { font-weight: 600; color: #212529; }
        .quantity-badge { background-color: #e9ecef; color: #495057; padding: 4px 12px; border-radius: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row">
        <div class="col-12">
            <a th:href="@{/}" class="btn btn-light mb-3">← Back to Home</a>

            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="mb-1">Inventory List</h3>
                        <p class="text-muted mb-0">Manage your product stock and details</p>
                    </div>
                    <a th:href="@{/product/create}" class="btn btn-primary shadow-sm">+ Create New Product</a>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Quantity</th>
                            <th class="text-center">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="product: ${products}">
                            <td class="align-middle">
                                <span class="product-name" th:text="${product.productName}"></span>
                            </td>
                            <td class="align-middle">
                                <span class="quantity-badge" th:text="${product.productQuantity}"></span>
                            </td>
                            <td class="text-center align-middle">
                                <div class="btn-group" role="group">
                                    <a th:href="@{/product/edit/{id}(id=${product.productId})}"
                                       class="btn btn-outline-warning btn-sm mx-1">Edit</a>

                                    <a th:href="@{/product/delete/{id}(id=${product.productId})}"
                                       class="btn btn-outline-danger btn-sm mx-1"
                                       onclick="return confirm('Are you sure you want to delete this product?')">Delete</a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="3" class="text-center py-5">
                                <div class="text-muted">
                                    <p class="mb-0">No products found in the inventory.</p>
                                    <small>Start by creating a new product above.</small>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
